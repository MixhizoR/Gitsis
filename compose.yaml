# Proje adini SABITLER: compose.yaml'i icinde bulunduran klasorun adindan
# turetilen varsayilan davranisa GUVENME. Sabit ad olmadan, ayni repo farkli
# klasor adiyla (orn. "Gitsis-main" vs "Gitsis-main-ma-v3.1.1") indirilirse
# HER BIRI kendi ayri (ve birbirinden habersiz) Postgres volume'una baglanir;
# bu da eski/terk edilmis bir klasorden kalma volume'un yeni bir indirmede
# sessizce yeniden kullanilip supheli "eksik sutun" hatalarina yol acmasina
# neden olabilir (bkz. Issue: fresh clone migrate hatasi). Sabit isim, ayni
# makinede bu repo hangi klasor adiyla calistirilirsa calistirilsin HEP AYNI
# volume + container kumesine baglanmasini garanti eder.
name: ehsim

services:
  db:
    image: postgres:15
    container_name: ehsim_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ehsim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Kok dizinde .env olustur}
      POSTGRES_DB: ehsim_rmt
    volumes:
      - ehsim_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ehsim -d ehsim_rmt"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    image: ehsim-migrate:latest
    container_name: ehsim_migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://ehsim:${POSTGRES_PASSWORD}@db:5432/ehsim_rmt?schema=public"
      JWT_SECRET: ${JWT_SECRET:?Kok dizinde .env olustur (bkz .env.example)}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?Kok dizinde .env olustur (bkz .env.example)}
      BCRYPT_SALT_ROUNDS: "12"
    command: sh -c "cd /app/backend && npx prisma db push --skip-generate --accept-data-loss && node src/seed.js"

  backend:
    image: ehsim-backend:latest
    container_name: ehsim_api
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgresql://ehsim:${POSTGRES_PASSWORD}@db:5432/ehsim_rmt?schema=public"
      PORT: "4001"
      JWT_SECRET: ${JWT_SECRET:?Kok dizinde .env olustur (bkz. .env.example)}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?Kok dizinde .env olustur (bkz. .env.example)}
      BCRYPT_SALT_ROUNDS: "12"
      PM_REGISTRATION_KEY: "${PM_REGISTRATION_KEY:-}"
      CORS_ORIGIN: "${CORS_ORIGIN:-}"
    healthcheck:
      test: ["CMD-SHELL", "node healthcheck.js"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 3

  frontend:
    image: ehsim-frontend:latest
    container_name: ehsim_web
    restart: unless-stopped
    init: true
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:8080"

volumes:
  ehsim_pgdata: