server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 25M;

    # SPA fallback: all non-file, non-api requests -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets: long-term immutable caching
    location /assets/ {
        expires max;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Reverse proxy to backend — /api prefix preserved (no trailing slash)
    location /api/ {
        proxy_pass http://backend:4001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health endpoint for nginx check
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
    }
}
