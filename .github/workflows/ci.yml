name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'

  frontend:
    name: Frontend — lint / test / build
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: './pnpm-lock.yaml'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter ehsim-rmt run lint
      - name: Format check
        run: pnpm --filter ehsim-rmt run format:check
      - name: Test
        run: pnpm --filter ehsim-rmt test
      - name: Build
        run: pnpm --filter ehsim-rmt run build

  backend:
    name: Backend — lint / test
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: test_password
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'ci-test-secret' }}
      DATABASE_URL: postgresql://postgres:test_password@localhost:5432/test_db
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: './pnpm-lock.yaml'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter ehsim-rmt-backend run lint
      - name: Format check
        run: pnpm --filter ehsim-rmt-backend run format:check
      - name: Run migrations & Test
        run: |
          pnpm --filter ehsim-rmt-backend run prisma:generate
          pnpm --filter ehsim-rmt-backend run db:push
          pnpm --filter ehsim-rmt-backend run test

  ci-status:
    name: CI Pipeline Status
    runs-on: ubuntu-latest
    needs: [detect-changes, frontend, backend]
    if: always()
    steps:
      - name: Pipeline Basarisizlik Kontrolu
        env:
          DETECT: ${{ needs.detect-changes.result }}
          FRONTEND: ${{ needs.frontend.result }}
          BACKEND: ${{ needs.backend.result }}
        run: |
          for r in "$DETECT" "$FRONTEND" "$BACKEND"; do
            if [ "$r" == "failure" ] || [ "$r" == "cancelled" ]; then
              echo "❌ Pipeline basarisiz oldu veya iptal edildi ($r)."
              exit 1
            fi
          done
          echo "✅ Degisiklik olan tum servisler basariyla build edildi ve testten gecti."
