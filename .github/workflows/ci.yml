name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Ayni PR'a ust uste commit atilirsa eski run'lari iptal et (Action dakikasi tasarrufu).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pipeline sadece kod cekip test kosuyor; token'i read-only birak (least privilege).
permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'

  frontend:
    name: Frontend — lint / test / build
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest # ADD THIS LINE
    env:
      POSTGRES_PASSWORD: test_password
    steps:
      - uses: actions/checkout@v4
      - name: Lint (Docker)
        run: |
          docker compose -f docker-compose.dev-tools.yml run --rm frontend-lint
      - name: Format check (Docker)
        run: |
          docker compose -f docker-compose.dev-tools.yml run --rm frontend-format-check
      - name: Test + build (Docker)
        run: |
          docker compose -f docker-compose.dev-tools.yml run --rm frontend-test

  backend:
    name: Backend — lint / test
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: test_password
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'ci-test-secret' }}
    steps:
      - uses: actions/checkout@v4
      - name: Lint (Docker)
        run: |
          docker compose -f docker-compose.dev-tools.yml run --rm backend-lint
      - name: Format check (Docker)
        run: |
          docker compose -f docker-compose.dev-tools.yml run --rm backend-format-check
      - name: Clean DB volume (fresh init)
        run: |
          docker compose -f docker-compose.dev-tools.yml down -v
      - name: Test (Docker)
        run: |
          docker compose -f docker-compose.dev-tools.yml run --rm backend-test
      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.dev-tools.yml down -v

  ci-status:
    name: CI Pipeline Status
    runs-on: ubuntu-latest
    needs: [detect-changes, frontend, backend]
    if: always()
    steps:
      - name: Pipeline Basarisizlik Kontrolu
        env:
          DETECT: ${{ needs.detect-changes.result }}
          FRONTEND: ${{ needs.frontend.result }}
          BACKEND: ${{ needs.backend.result }}
        run: |
          for r in "$DETECT" "$FRONTEND" "$BACKEND"; do
            if [ "$r" == "failure" ] || [ "$r" == "cancelled" ]; then
              echo "❌ Pipeline basarisiz oldu veya iptal edildi ($r)."
              exit 1
            fi
          done
          echo "✅ Degisiklik olan tum servisler basariyla build edildi ve testten gecti."